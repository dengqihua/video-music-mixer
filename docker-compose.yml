services:
  video-mixer:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: video-mixer

    # Mac mini 16GB 统一内存：给 Docker VM 和其他 macOS 程序留出余量。
    cpus: 4
    mem_limit: 12g
    shm_size: 1gb

    environment:
      TZ: Asia/Shanghai
      VIDEO_MIXER_DATA_DIR: /data
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TORCH_HOME: /root/.cache/torch

    volumes:
      - ./data:/data
      - ./model-cache:/root/.cache/torch

    working_dir: /app
    restart: "no"
